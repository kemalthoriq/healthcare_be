version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Conn).SetDeadline
        - (*net/smtp.Client).Close
        - (*database/sql.DB).Close
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -S1016
        - -QF1001
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        text: SA4000
